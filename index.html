<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agri-Supply Portal & Voice AI Guide</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js (Core & Focus Plugins) -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        .pulse-ring {
            animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans" x-data="agriApp()">

    <!-- TOP NAV BAR -->
    <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🌾</span>
                <h1 class="text-xl font-bold tracking-tight" x-text="t('appTitle')">Mandi Connect</h1>
            </div>
            
            <!-- Language Selector -->
            <div class="flex items-center space-x-3">
                <label class="text-xs font-semibold text-emerald-100 hidden sm:inline" x-text="t('selectLanguage')">Language:</label>
                <select x-model="currentLang" @change="changeLanguage()" class="bg-emerald-800 text-white text-sm rounded-lg px-3 py-1.5 border border-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-400">
                    <option value="en-US">English</option>
                    <option value="hi-IN">हिंदी (Hindi)</option>
                    <option value="pa-IN">ਪੰਜਾਬੀ (Punjabi)</option>
                    <option value="mr-IN">मराठी (Marathi)</option>
                    <option value="te-IN">తెలుగు (Telugu)</option>
                </select>
            </div>
        </div>
    </header>

    <!-- MAIN APP CONTAINER -->
    <main class="max-w-6xl mx-auto px-4 py-6">

        <!-- TAB NAVIGATION -->
        <nav class="flex border-b border-slate-200 mb-6 bg-white rounded-t-lg shadow-sm">
            <button @click="activeTab = 'portal'" :class="activeTab === 'portal' ? 'border-emerald-600 text-emerald-600 font-bold' : 'border-transparent text-slate-500 hover:text-slate-700'" class="flex-1 py-3 px-4 text-center border-b-2 font-medium text-sm transition" x-text="t('tabToken')">
                Token Registration
            </button>
            <button @click="activeTab = 'queue'" :class="activeTab === 'queue' ? 'border-emerald-600 text-emerald-600 font-bold' : 'border-transparent text-slate-500 hover:text-slate-700'" class="flex-1 py-3 px-4 text-center border-b-2 font-medium text-sm transition" x-text="t('tabQueue')">
                Live Queue
            </button>
            <button @click="activeTab = 'scan'" :class="activeTab === 'scan' ? 'border-emerald-600 text-emerald-600 font-bold' : 'border-transparent text-slate-500 hover:text-slate-700'" class="flex-1 py-3 px-4 text-center border-b-2 font-medium text-sm transition" x-text="t('tabScan')">
                Scanner & Verification
            </button>
        </nav>

        <!-- TAB 1: TOKEN REGISTRATION FORM -->
        <section x-show="activeTab === 'portal'" x-cloak class="space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <span x-text="t('formHeading')">Generate Gate Pass Token</span>
                </h2>

                <form @submit.prevent="generateToken('pwa')" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1" x-text="t('lblFarmerName')">Farmer Name</label>
                        <input type="text" x-model="form.name" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="e.g. Ramesh Kumar">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1" x-text="t('lblGovtId')">Government ID Type</label>
                        <select x-model="form.idType" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                            <option value="Aadhaar">Aadhaar Card</option>
                            <option value="PAN">PAN Card</option>
                            <option value="VoterID">Voter ID</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1" x-text="t('lblCrop')">Crop Type</label>
                        <select x-model="form.crop" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                            <option value="Wheat (Gehun)">Wheat (Gehun)</option>
                            <option value="Paddy (Dhan)">Paddy (Dhan)</option>
                            <option value="Mustard (Sarson)">Mustard (Sarson)</option>
                            <option value="Pulses (Dal)">Pulses (Dal)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1" x-text="t('lblWeight')">Estimated Weight (Quintals)</label>
                        <input type="number" x-model="form.weight" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="e.g. 50">
                    </div>

                    <div class="md:col-span-2">
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1" x-text="t('lblMandi')">Mandi Hub Location</label>
                        <select x-model="form.mandi" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                            <option value="Central APMC Yard - Hub 01">Central APMC Yard - Hub 01</option>
                            <option value="North Grain Hub - Gate 03">North Grain Hub - Gate 03</option>
                            <option value="South Procurement Yard">South Procurement Yard</option>
                        </select>
                    </div>

                    <div class="md:col-span-2 mt-2">
                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg shadow transition" x-text="t('btnSubmitToken')">
                            Generate Delivery Slot Token
                        </button>
                    </div>
                </form>
            </div>

            <!-- Active Generated Token Result Card -->
            <div x-show="activeToken" x-cloak class="bg-emerald-50 border border-emerald-200 p-6 rounded-xl">
                <div class="flex justify-between items-start">
                    <div>
                        <span class="text-xs font-bold uppercase tracking-wider text-emerald-600">Active Gate Pass</span>
                        <h3 class="text-2xl font-black text-slate-800" x-text="activeToken?.id"></h3>
                    </div>
                    <button @click="toggleGeofence()" :class="activeToken?.inGeofence ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-700'" class="px-3 py-1 rounded-full text-xs font-bold">
                        <span x-text="activeToken?.inGeofence ? '✓ Inside Mandi Geofence' : '○ Outside Mandi Geofence'"></span>
                    </button>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-4 text-sm">
                    <div><span class="text-slate-500 block">Farmer:</span> <strong x-text="activeToken?.name"></strong></div>
                    <div><span class="text-slate-500 block">Crop:</span> <strong x-text="activeToken?.crop"></strong></div>
                    <div><span class="text-slate-500 block">Weight:</span> <strong x-text="activeToken?.weight + ' Quintals'"></strong></div>
                    <div><span class="text-slate-500 block">Current Stage:</span> <strong class="text-emerald-700" x-text="activeToken?.stage"></strong></div>
                </div>
            </div>
        </section>

        <!-- TAB 2: LIVE QUEUE VIEW -->
        <section x-show="activeTab === 'queue'" x-cloak class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-slate-800" x-text="t('queueHeading')">Live Mandi Queue</h2>
                <button @click="addMockFarmer()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg border font-semibold">
                    + Simulate Incoming Truck
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 uppercase text-xs">
                            <th class="p-3 rounded-l-lg">Token ID</th>
                            <th class="p-3">Farmer</th>
                            <th class="p-3">Crop</th>
                            <th class="p-3">Weight</th>
                            <th class="p-3">Status / Stage</th>
                            <th class="p-3 rounded-r-lg">Action</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        <template x-for="(item, index) in queue" :key="item.id">
                            <tr :class="item.isUser ? 'bg-emerald-50 font-semibold' : ''">
                                <td class="p-3 font-mono text-emerald-700" x-text="item.id"></td>
                                <td class="p-3" x-text="item.name"></td>
                                <td class="p-3" x-text="item.crop"></td>
                                <td class="p-3" x-text="item.weight + ' Qtl'"></td>
                                <td class="p-3">
                                    <span :class="{
                                        'bg-amber-100 text-amber-800': item.stage === 'Waiting Entry',
                                        'bg-blue-100 text-blue-800': item.stage === 'Weighbridge Quality Test',
                                        'bg-emerald-100 text-emerald-800': item.stage === 'Unloading Completed'
                                    }" class="px-2.5 py-1 rounded-full text-xs font-semibold" x-text="item.stage"></span>
                                </td>
                                <td class="p-3">
                                    <button @click="advanceStage(index)" class="text-xs bg-slate-800 text-white px-2 py-1 rounded hover:bg-slate-700">
                                        Next Stage →
                                    </button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- TAB 3: SCANNER & VERIFICATION -->
        <section x-show="activeTab === 'scan'" x-cloak class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 max-w-xl mx-auto">
            <h2 class="text-lg font-bold text-slate-800 mb-4 text-center" x-text="t('scanHeading')">Gate Pass Scanner</h2>
            <div class="flex gap-2 mb-4">
                <input type="text" x-model="scanInput" placeholder="Enter Token ID (e.g. AFE-PWA-8821)" class="flex-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                <button @click="processScan()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg hover:bg-emerald-700 font-semibold text-sm">Verify</button>
            </div>

            <div x-show="scannedResult" class="p-4 bg-slate-50 rounded-lg border border-slate-200">
                <h4 class="font-bold text-slate-800 border-b pb-2 mb-2">Token Verification Result</h4>
                <div class="space-y-1 text-sm">
                    <p><strong>Token ID:</strong> <span x-text="scannedResult?.id"></span></p>
                    <p><strong>Farmer Name:</strong> <span x-text="scannedResult?.name"></span></p>
                    <p><strong>Crop Type:</strong> <span x-text="scannedResult?.crop"></span></p>
                    <p><strong>Weight:</strong> <span x-text="scannedResult?.weight + ' Quintals'"></span></p>
                </div>
            </div>
        </section>

    </main>

    <!-- FLOATING LIVE AI TRANSLATOR & ASSISTANT UI -->
    <div class="fixed bottom-6 right-6 z-50 flex flex-col items-end">
        
        <!-- AI Response Speech Bubble -->
        <div x-show="aiSpeechBubble" x-transition x-cloak class="mb-3 max-w-sm bg-slate-900 text-white p-4 rounded-2xl shadow-xl text-sm border border-slate-700 relative">
            <div class="flex justify-between items-start mb-1">
                <span class="text-xs text-emerald-400 font-bold flex items-center gap-1">
                    🤖 AI Assistant (<span x-text="currentLang.split('-')[0].toUpperCase()"></span>)
                </span>
                <button @click="aiSpeechBubble = ''" class="text-slate-400 hover:text-white text-xs">✕</button>
            </div>
            <p x-text="aiSpeechBubble" class="leading-snug"></p>
        </div>

        <!-- Microphone Floating Action Button -->
        <button @click="toggleVoiceAssistant()" 
                :class="isListening ? 'bg-red-600 pulse-ring' : 'bg-emerald-600 hover:bg-emerald-700'"
                class="w-16 h-16 rounded-full text-white flex items-center justify-center shadow-2xl transition-all duration-300 focus:outline-none">
            <svg x-show="!isListening" class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
            </svg>
            <svg x-show="isListening" class="w-8 h-8 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path>
            </svg>
        </button>
    </div>

    <!-- APPLICATION LOGIC (ALPINE.JS) -->
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('agriApp', () => ({
                activeTab: 'portal',
                currentLang: 'en-US',
                isListening: false,
                aiSpeechBubble: '',
                scanInput: '',
                scannedResult: null,
                activeToken: null,
                
                // Form Model
                form: {
                    name: '',
                    idType: 'Aadhaar',
                    crop: 'Wheat (Gehun)',
                    weight: '',
                    mandi: 'Central APMC Yard - Hub 01'
                },

                // Mock Queue Data
                queue: [
                    { id: 'AFE-PWA-8821', name: 'Suresh Patel', crop: 'Paddy', weight: 40, slot: '10:00 AM', inGeofence: true, stage: 'Weighbridge Quality Test', isUser: false },
                    { id: 'AFE-IVR-4412', name: 'Harpreet Singh', crop: 'Wheat', weight: 120, slot: '10:30 AM', inGeofence: true, stage: 'Waiting Entry', isUser: false }
                ],

                // Static UI Translations Dictionary
                i18n: {
                    'en-US': {
                        appTitle: 'Mandi Connect Portal',
                        selectLanguage: 'Language:',
                        tabToken: 'Token Registration',
                        tabQueue: 'Live Queue Status',
                        tabScan: 'Gate Verification',
                        formHeading: 'Generate Delivery Slot Token',
                        lblFarmerName: 'Farmer Full Name',
                        lblGovtId: 'Government ID Type',
                        lblCrop: 'Crop Type',
                        lblWeight: 'Weight (Quintals)',
                        lblMandi: 'Mandi Yard Location',
                        btnSubmitToken: 'Generate Gate Pass Token',
                        queueHeading: 'Live Mandi Queue Stream',
                        scanHeading: 'Verification QR/Token Scanner'
                    },
                    'hi-IN': {
                        appTitle: 'मंडी कनेक्ट पोर्टल',
                        selectLanguage: 'भाषा चुने:',
                        tabToken: 'टोकन पंजीकरण',
                        tabQueue: 'लाइव कतार स्थिति',
                        tabScan: 'गेट सत्यापन',
                        formHeading: 'डिलीवरी स्लॉट टोकन बनाएं',
                        lblFarmerName: 'किसान का पूरा नाम',
                        lblGovtId: 'सरकारी पहचान पत्र',
                        lblCrop: 'फसल का प्रकार',
                        lblWeight: 'वजन (क्विंटल)',
                        lblMandi: 'मंडी का स्थान',
                        btnSubmitToken: 'गेट पास टोकन जारी करें',
                        queueHeading: 'लाइव मंडी कतार',
                        scanHeading: 'टोकन सत्यापन स्कैनर'
                    }
                },

                t(key) {
                    const langDict = this.i18n[this.currentLang] || this.i18n['en-US'];
                    return langDict[key] || this.i18n['en-US'][key] || key;
                },

                init() {
                    this.setupSpeechRecognition();
                },

                changeLanguage() {
                    this.speakText(this.currentLang === 'hi-IN' ? 'भाषा बदल दी गई है' : 'Language updated');
                },

                // --- SPEECH RECOGNITION & AI GUIDE ENGINE ---
                setupSpeechRecognition() {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    if (!SpeechRecognition) return;

                    this.recognition = new SpeechRecognition();
                    this.recognition.continuous = false;
                    this.recognition.interimResults = false;

                    this.recognition.onresult = (event) => {
                        const transcript = event.results[0][0].transcript;
                        this.processVoiceCommand(transcript);
                    };

                    this.recognition.onend = () => {
                        this.isListening = false;
                    };
                },

                toggleVoiceAssistant() {
                    if (!this.recognition) {
                        alert('Browser does not support Web Speech API.');
                        return;
                    }

                    if (this.isListening) {
                        this.recognition.stop();
                        this.isListening = false;
                    } else {
                        this.recognition.lang = this.currentLang;
                        this.recognition.start();
                        this.isListening = true;
                        this.aiSpeechBubble = "Listening... Speak your command (e.g., 'Open Queue' or 'Set weight to 50 quintals')";
                    }
                },

                // Client-Side AI Rules & Navigation Engine
                processVoiceCommand(text) {
                    const query = text.toLowerCase();
                    let responseMsg = '';

                    // Command 1: Tab Navigation
                    if (query.includes('queue') || query.includes('कतार') || query.includes('line')) {
                        this.activeTab = 'queue';
                        responseMsg = this.currentLang === 'hi-IN' ? 'लाइव कतार पेज पर भेजा गया।' : 'Navigating to Live Queue page.';
                    } 
                    else if (query.includes('token') || query.includes('form') || query.includes('टोकन') || query.includes('भरें')) {
                        this.activeTab = 'portal';
                        responseMsg = this.currentLang === 'hi-IN' ? 'टोकन पंजीकरण फॉर्म पर भेजा गया।' : 'Opening Token Registration form.';
                    } 
                    else if (query.includes('scan') || query.includes('verify') || query.includes('स्कैन')) {
                        this.activeTab = 'scan';
                        responseMsg = this.currentLang === 'hi-IN' ? 'स्कैनर पेज खोला गया।' : 'Opening Scanner Verification.';
                    }
                    // Command 2: Form Autofill via Voice
                    else if (query.includes('weight') || query.includes('quintal') || query.includes('क्विंटल')) {
                        const numbers = query.match(/\d+/);
                        if (numbers) {
                            this.form.weight = numbers[0];
                            this.activeTab = 'portal';
                            responseMsg = this.currentLang === 'hi-IN' ? `वजन ${numbers[0]} क्विंटल सेट किया गया।` : `Updated weight to ${numbers[0]} quintals.`;
                        }
                    }
                    // Default Fallback
                    else {
                        responseMsg = this.currentLang === 'hi-IN' 
                            ? `मैंने सुना: "${text}". आप टोकन, कतार या स्कैनर खोलने के लिए बोल सकते हैं।` 
                            : `Received: "${text}". You can ask me to open Queue, Registration, or Scanner.`;
                    }

                    this.aiSpeechBubble = responseMsg;
                    this.speakText(responseMsg);
                },

                speakText(text) {
                    if (!('speechSynthesis' in window)) return;
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = this.currentLang;
                    window.speechSynthesis.speak(utterance);
                },

                // --- CORE APP BUSINESS LOGIC ---
                generateToken(channelName) {
                    const randomId = 'AFE-' + channelName.toUpperCase() + '-' + Math.floor(1000 + Math.random() * 9000);
                    const newToken = {
                        id: randomId,
                        name: this.form.name || 'Ramesh Kumar',
                        crop: this.form.crop,
                        weight: this.form.weight || 50,
                        mandi: this.form.mandi,
                        slot: 'Today, 10:30 AM - 11:30 AM',
                        inGeofence: true,
                        stage: 'Waiting Entry',
                        isUser: true
                    };

                    this.activeToken = newToken;
                    this.queue.unshift(newToken);
                    this.speakText("Token Generated Successfully");
                },

                toggleGeofence() {
                    if (this.activeToken) {
                        this.activeToken.inGeofence = !this.activeToken.inGeofence;
                    }
                },

                addMockFarmer() {
                    const mockNames = ['Baldev Ram', 'Gurdeep Kaur', 'Mohan Lal', 'Sunita Devi'];
                    const mockCrops = ['Wheat (Gehun)', 'Paddy (Dhan)', 'Pulses (Dal)'];
                    const randomName = mockNames[Math.floor(Math.random() * mockNames.length)];
                    const randomCrop = mockCrops[Math.floor(Math.random() * mockCrops.length)];

                    this.queue.push({
                        id: 'AFE-SYS-' + Math.floor(1000 + Math.random() * 9000),
                        name: randomName,
                        crop: randomCrop,
                        weight: Math.floor(Math.random() * 80) + 20,
                        slot: '11:30 AM - 12:30 PM',
                        inGeofence: true,
                        stage: 'Waiting Entry',
                        isUser: false
                    });
                },

                advanceStage(index) {
                    const stages = ['Waiting Entry', 'Weighbridge Quality Test', 'Unloading Completed'];
                    const currentStageIndex = stages.indexOf(this.queue[index].stage);
                    if (currentStageIndex < stages.length - 1) {
                        this.queue[index].stage = stages[currentStageIndex + 1];
                    }
                },

                processScan() {
                    const found = this.queue.find(item => item.id.toLowerCase() === this.scanInput.trim().toLowerCase());
                    this.scannedResult = found || {
                        id: this.scanInput || 'AFE-PWA-10293',
                        name: 'Ramesh Kumar',
                        crop: 'Wheat (Gehun)',
                        weight: 50
                    };
                }
            }));
        });
    </script>
</body>
</html>
